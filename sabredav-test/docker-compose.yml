services:
  nginx:
    # Pulled from GHCR (prebuilt by the Docker Images workflow); the build
    # key below still allows a local rebuild: docker compose build nginx
    image: ghcr.io/goopil/fast-dav-rs/sabredav-nginx:latest
    build: 
      context: ./nginx
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - sabredav
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./public:/var/www/html/public

  sabredav:
    # Pulled from GHCR (prebuilt by the Docker Images workflow); the build
    # key below still allows a local rebuild: docker compose build sabredav
    image: ghcr.io/goopil/fast-dav-rs/sabredav-app:latest
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - mysql
    environment:
      - MYSQL_HOST=mysql
      - MYSQL_DATABASE=sabredav
      - MYSQL_USER=sabredav
      - MYSQL_PASSWORD=sabredav
    volumes:
      - ./public:/var/www/html/public

  mysql:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=sabredav
      - MYSQL_USER=sabredav
      - MYSQL_PASSWORD=sabredav
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d

volumes:
  mysql_data:
