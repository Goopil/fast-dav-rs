[package]
name = "fast-dav-rs"
version = "0.7.2"
edition = "2024"
rust-version = "1.85"
description = "Fast CalDAV/CardDAV client with hyper + rustls, HTTP/2, compression, batching, and streaming XML parsing."
license = "LGPL-3.0"
keywords = ["caldav", "carddav", "webdav", "client"]
categories = ["network-programming", "asynchronous", "api-bindings"]
documentation = "https://docs.rs/fast-dav-rs"
homepage = "https://github.com/Goopil/fast-dav-rs"
repository = "https://github.com/Goopil/fast-dav-rs"
readme = "README.md"
include = ["Cargo.toml", "LICENSE", "README.md", "src/**/*.rs"]

[dependencies]
anyhow = "1"
base64 = "0.23"
rustls = "0.23"
rustls-pemfile = "2"
rustls-native-certs = "0.8"
webpki-roots = "1"
tower-service = "0.3"
bytes = "1"
futures = "0.3"
hyper = { version = "1", features = ["client", "http1", "http2"] }
hyper-rustls = { version = "0.27", features = ["http2", "webpki-roots"] }
quick-xml = { version = "0.41.0", features = ["async-tokio"] }
tokio = { version = "1", features = ["macros", "sync", "time"] }
tokio-util = "0.7"
async-compression = { version = "0.4", features = ["tokio", "brotli", "gzip", "zstd"] }
hyper-util = { version = "0.1", features = ["client", "http1", "http2", "tokio", "client-proxy"] }
http-body-util = "0.1"
zeroize = "1"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"

[[test]]
name = "unit_tests"
path = "tests/unit/mod.rs"

[[test]]
name = "e2e_tests"
path = "tests/e2e/mod.rs"

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
