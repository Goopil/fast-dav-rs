# --- SonarCloud project configuration ---
sonar.projectKey=Goopil_fast-dav-rs
sonar.organization=goopil

# --- Source & test directories ---
sonar.sources=src/
sonar.tests=tests/

# --- Coverage (LCOV report from cargo-tarpaulin) ---
sonar.rust.lcov.reportPaths=target/tarpaulin/lcov.info

# --- Exclusions ---
# Exclude test helpers and e2e test infrastructure from analysis
sonar.exclusions=tests/e2e/**,sabredav-test/**

# --- Language ---
sonar.language=rust
