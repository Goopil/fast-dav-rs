# --- SonarCloud project configuration ---
sonar.projectKey=Goopil_fast-dav-rs
sonar.organization=goopil

# --- Source & test directories ---
sonar.sources=src/
sonar.tests=tests/

# --- Coverage (LCOV report from cargo-llvm-cov) ---
sonar.rust.lcov.reportPaths=target/llvm-cov/lcov.info

# --- Exclusions ---
# Exclude test helpers, e2e test infrastructure, and benchmarks (no coverage
# gate: benches are exercised by `cargo bench`, not unit tests) from analysis;
# fuzz/ is the nightly-only cargo-fuzz harness (separate workspace, no prod paths).
sonar.exclusions=tests/e2e/**,sabredav-test/**,benches/**,fuzz/**

# --- Language ---
sonar.language=rust
