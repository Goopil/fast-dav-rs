name: Coverage & Analysis

permissions:
  contents: read
  pull-requests: write

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage-and-analysis:
    name: Coverage (Codecov + SonarCloud)
    # ci-base ships llvm-tools-preview, cargo-llvm-cov and cargo-nextest plus
    # an instrumented (-Cinstrument-coverage) dependency build in
    # /opt/warm-target, so only the crate itself recompiles with coverage.
    runs-on: ubuntu-latest
    container: ghcr.io/goopil/fast-dav-rs/ci-base:latest

    steps:
      - name: Checkout sources (full history for SonarCloud)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Restore warm dependency build
        run: cp -a /opt/warm-target/. "$GITHUB_WORKSPACE/target/"

      - name: Run tests with coverage and JUnit output
        run: |
          mkdir -p target/llvm-cov
          cargo llvm-cov nextest \
            --test unit_tests \
            --all-features \
            --profile ci \
            --no-fail-fast \
            --lcov \
            --output-path target/llvm-cov/lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: target/llvm-cov/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report-type: test_results
          files: target/nextest/junit.xml

      - name: SonarCloud analysis
        uses: SonarSource/sonarqube-scan-action@v8.2.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
