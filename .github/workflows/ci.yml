name: CI

permissions:
  contents: read

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint and Test
    # ci-base ships pinned toolchains (stable + 1.85 MSRV), CI tools
    # (nextest, llvm-cov, codspeed) and a pre-compiled dependency tree
    # (warm target at /opt/warm-target, built by the Docker Images
    # workflow). Only the crate itself recompiles per run.
    runs-on: ubuntu-latest
    container: ghcr.io/goopil/fast-dav-rs/ci-base:latest

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Restore warm dependency build
        run: cp -a /opt/warm-target/. "$GITHUB_WORKSPACE/target/"

      - name: Cargo fmt
        run: cargo fmt --all --check

      - name: Cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Cargo nextest
        run: cargo nextest run --all-features --locked --test unit_tests

      - name: Cargo build examples
        run: cargo build --examples --all-features --locked

      - name: Cargo doc tests
        run: cargo test --doc --all-features --locked

      - name: Cargo package
        # Packaging checks (include list, metadata, license). The compile
        # verification stays in the publish workflow (cargo publish dry-run).
        run: cargo package --locked --no-deps

  msrv:
    name: Verify MSRV (1.85)
    runs-on: ubuntu-latest
    container: ghcr.io/goopil/fast-dav-rs/ci-base:latest
    steps:
      - uses: actions/checkout@v7
      - name: Restore warm dependency build
        run: cp -a /opt/warm-target/. "$GITHUB_WORKSPACE/target/"
      - name: Cargo check (MSRV)
        # The image carries a pre-warmed 1.85.0 check target.
        run: cargo check --all-features --locked
        env:
          RUSTUP_TOOLCHAIN: "1.85.0"

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
