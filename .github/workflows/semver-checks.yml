name: Semver Checks

permissions:
  contents: read

on:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semver-checks:
    name: Semver Checks
    # ci-base provides the stable toolchain plus a warm dependency tree, so
    # only the crate itself is rebuilt for the current-side rustdoc analysis.
    runs-on: ubuntu-latest
    container: ghcr.io/goopil/fast-dav-rs/ci-base:latest

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Restore warm dependency build
        run: cp -a /opt/warm-target/. "$GITHUB_WORKSPACE/target/"

      - name: Check semver
        uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          # Compare against the latest release (crates.io version == latest release tag)
          # with every feature enabled: a break behind a non-default feature is still breaking.
          feature-group: all-features
          # Reuse the toolchain shipped in the ci-base image.
          rust-toolchain: manual
