name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Cache cargo artifacts
      uses: Swatinem/rust-cache@v2
      with:
        shared-key: stable-rust

    - name: Run unit tests
      run: |
        cargo test --manifest-path Cargo.toml --test unit_tests

  e2e-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Docker
      uses: docker/setup-buildx-action@v4

    - name: Install docker compose V2
      run: |
        mkdir -p ~/.docker/cli-plugins
        curl -SL https://github.com/docker/compose/releases/download/v2.29.7/docker-compose-linux-x86_64 -o ~/.docker/cli-plugins/docker-compose
        chmod +x ~/.docker/cli-plugins/docker-compose
        docker compose version

    - name: Build SabreDAV PHP image (cached)
      uses: docker/build-push-action@v7
      with:
        context: sabredav-test
        file: sabredav-test/Dockerfile
        load: true
        push: false
        tags: local/sabredav-app:latest
        cache-from: type=gha,scope=sabredav-app
        cache-to: type=gha,scope=sabredav-app,mode=max

    - name: Build nginx image (cached)
      uses: docker/build-push-action@v7
      with:
        context: sabredav-test/nginx
        file: sabredav-test/nginx/Dockerfile
        load: true
        push: false
        tags: local/sabredav-nginx:latest
        cache-from: type=gha,scope=sabredav-nginx
        cache-to: type=gha,scope=sabredav-nginx,mode=max

    - name: Start services with Docker Compose
      run: |
        cd sabredav-test
        docker compose up -d --no-build

    - name: Wait for services to be ready
      run: |
        echo "Waiting for services to start..."
        sleep 30
        (
          cd sabredav-test
          docker compose ps
        )
        echo "Checking if services are responding..."
        STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/)
        if [ "$STATUS" != "200" ] && [ "$STATUS" != "401" ] && [ "$STATUS" != "207" ]; then
          echo "Health check failed with HTTP status $STATUS"
          exit 1
        fi
        echo "Service responded with HTTP $STATUS (acceptable)"

    - name: Reset and seed database
      run: |
        cd sabredav-test
        ./reset-db.sh

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Cache cargo artifacts
      uses: Swatinem/rust-cache@v2
      with:
        shared-key: stable-rust

    - name: Run E2E tests
      run: |
        cargo test --manifest-path Cargo.toml --test e2e_tests
      env:
        SABREDAV_URL: http://localhost:8080

    - name: Debug - Show test logs if failed
      if: failure()
      run: |
        cd sabredav-test
        echo "===docker compose Logs ==="
        docker compose logs

    - name: Stop services
      if: always()
      run: |
        cd sabredav-test
        docker compose down -v

  e2e-radicale:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Install docker compose V2
      run: |
        mkdir -p ~/.docker/cli-plugins
        curl -SL https://github.com/docker/compose/releases/download/v2.29.7/docker-compose-linux-x86_64 -o ~/.docker/cli-plugins/docker-compose
        chmod +x ~/.docker/cli-plugins/docker-compose
        docker compose version

    - name: Start Radicale fixture
      run: ./radicale-test/setup.sh

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Cache cargo artifacts
      uses: Swatinem/rust-cache@v2
      with:
        shared-key: stable-rust

    - name: Run Radicale e2e tests
      run: |
        cargo test --manifest-path Cargo.toml --test e2e_radicale
      env:
        RADICALE_URL: http://localhost:8081

    - name: Debug - Show fixture logs if failed
      if: failure()
      run: |
        cd radicale-test
        echo "=== Radicale logs ==="
        docker compose logs

    - name: Stop services
      if: always()
      run: |
        cd radicale-test
        docker compose down -v

  e2e-nextcloud:
    # The Nextcloud image is the heaviest fixture (first boot installs the
    # instance); the compose healthcheck + the setup.sh wait loop keep this
    # bounded. The image itself is pulled from Docker Hub (nothing to build).
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Install docker compose V2
      run: |
        mkdir -p ~/.docker/cli-plugins
        curl -SL https://github.com/docker/compose/releases/download/v2.29.7/docker-compose-linux-x86_64 -o ~/.docker/cli-plugins/docker-compose
        chmod +x ~/.docker/cli-plugins/docker-compose
        docker compose version

    - name: Pull Nextcloud image
      run: docker pull nextcloud:stable-apache

    - name: Start Nextcloud fixture
      run: ./nextcloud-test/setup.sh

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Cache cargo artifacts
      uses: Swatinem/rust-cache@v2
      with:
        shared-key: stable-rust

    - name: Run Nextcloud e2e tests
      run: |
        # Serialized: parallel test threads hit SQLite write contention in the
        # Nextcloud fixture (sporadic 500s on PUT since the suite grew).
        cargo test --manifest-path Cargo.toml --test e2e_nextcloud -- --test-threads=1
      env:
        NEXTCLOUD_URL: http://localhost:8083

    - name: Debug - Show fixture logs if failed
      if: failure()
      run: |
        cd nextcloud-test
        echo "=== Nextcloud logs ==="
        docker compose logs --tail 200

    - name: Stop services
      if: always()
      run: |
        cd nextcloud-test
        docker compose down -v
