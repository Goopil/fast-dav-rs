name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    # Fixture images are prebuilt by the Docker Images workflow and pulled
    # from GHCR (no build step here; keep image/registry in sync there).
    - name: Pull SabreDAV fixture images
      run: |
        docker pull ghcr.io/goopil/fast-dav-rs/sabredav-app:latest
        docker pull ghcr.io/goopil/fast-dav-rs/sabredav-nginx:latest

    - name: Start services with Docker Compose
      run: |
        cd sabredav-test
        docker compose up -d --no-build

    - name: Wait for services to be ready
      run: |
        echo "Waiting for services to start..."
        for _ in $(seq 1 24); do
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/ || true)
          case "$STATUS" in
            200|401|207)
              echo "Service responded with HTTP $STATUS (acceptable)"
              exit 0
              ;;
          esac
          sleep 5
        done
        echo "Health check failed (last status: ${STATUS:-none})"
        exit 1

    - name: Reset and seed database
      run: |
        cd sabredav-test
        ./reset-db.sh

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Cache cargo artifacts
      uses: Swatinem/rust-cache@v2
      with:
        shared-key: stable-rust

    - name: Run E2E tests
      run: |
        cargo test --manifest-path Cargo.toml --test e2e_tests
      env:
        SABREDAV_URL: http://localhost:8080

    - name: Debug - Show test logs if failed
      if: failure()
      run: |
        cd sabredav-test
        echo "===docker compose Logs ==="
        docker compose logs

    - name: Stop services
      if: always()
      run: |
        cd sabredav-test
        docker compose down -v

  e2e-radicale:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Start Radicale fixture
      run: ./radicale-test/setup.sh

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Cache cargo artifacts
      uses: Swatinem/rust-cache@v2
      with:
        shared-key: stable-rust

    - name: Run Radicale e2e tests
      run: |
        cargo test --manifest-path Cargo.toml --test e2e_radicale
      env:
        RADICALE_URL: http://localhost:8081

    - name: Debug - Show fixture logs if failed
      if: failure()
      run: |
        cd radicale-test
        echo "=== Radicale logs ==="
        docker compose logs

    - name: Stop services
      if: always()
      run: |
        cd radicale-test
        docker compose down -v

  e2e-nextcloud:
    # The Nextcloud image is preinstalled (first-boot install baked in by the
    # Docker Images workflow), so startup is seconds, not minutes. The
    # compose healthcheck + the setup.sh wait loop keep this bounded.
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Start Nextcloud fixture
      run: ./nextcloud-test/setup.sh

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Cache cargo artifacts
      uses: Swatinem/rust-cache@v2
      with:
        shared-key: stable-rust

    - name: Run Nextcloud e2e tests
      run: |
        # Serialized: parallel test threads hit SQLite write contention in the
        # Nextcloud fixture (sporadic 500s on PUT since the suite grew).
        cargo test --manifest-path Cargo.toml --test e2e_nextcloud -- --test-threads=1
      env:
        NEXTCLOUD_URL: http://localhost:8083

    - name: Debug - Show fixture logs if failed
      if: failure()
      run: |
        cd nextcloud-test
        echo "=== Nextcloud logs ==="
        docker compose logs --tail 200

    - name: Stop services
      if: always()
      run: |
        cd nextcloud-test
        docker compose down -v
