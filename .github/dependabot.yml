version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    groups:
      rust-deps:
        patterns:
          - "*"
    labels:
      - "dependencies"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    groups:
      github-actions:
        patterns:
          - "*"
    ignore:
      # MSRV guard: this action ref IS the tested toolchain version
      # (must match `rust-version` in Cargo.toml). Bumping it silently
      # disables MSRV verification. Update it manually on MSRV bumps.
      - dependency-name: "dtolnay/rust-toolchain"
    labels:
      - "dependencies"
